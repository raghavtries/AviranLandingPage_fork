<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="Basic architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <style>
      .title { font: 700 28px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #e5e7eb; }
      .label { font: 600 18px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #e5e7eb; }
      .muted { font: 500 14px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; fill: #94a3b8; }
      .box { fill: url(#card); stroke: #334155; stroke-width: 2; rx: 18; }
      .pill { fill: #0b1220; stroke: #334155; stroke-width: 2; rx: 999; }
      .line { stroke: #60a5fa; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dline { stroke: #22c55e; stroke-width: 3; stroke-dasharray: 10 7; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="url(#bg)"/>
  <text x="48" y="64" class="title">Basic architecture</text>
  <text x="48" y="92" class="muted">Router → Specialist → Verification with tool calls and evidence constraints</text>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="310" height="140" class="box"/>
    <text x="94" y="200" class="label">Routing layer</text>
    <text x="94" y="230" class="muted">Selects agent + tools</text>
    <rect x="94" y="248" width="240" height="34" class="pill"/>
    <text x="112" y="271" class="muted">Input: ticket + context</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="445" y="150" width="310" height="140" class="box"/>
    <text x="479" y="200" class="label">Specialist agent</text>
    <text x="479" y="230" class="muted">Investigates + hypothesizes</text>
    <rect x="479" y="248" width="240" height="34" class="pill"/>
    <text x="497" y="271" class="muted">Tools: logs, sensors</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="150" width="310" height="140" class="box"/>
    <text x="864" y="200" class="label">Verification agent</text>
    <text x="864" y="230" class="muted">Checks evidence + constraints</text>
    <rect x="864" y="248" width="240" height="34" class="pill"/>
    <text x="882" y="271" class="muted">Output: diagnosis + next step</text>
  </g>

  <path class="line" d="M 370 220 C 395 220, 420 220, 445 220"/>
  <path class="line" d="M 755 220 C 780 220, 805 220, 830 220"/>

  <g>
    <rect x="220" y="340" width="760" height="120" class="box" opacity="0.95"/>
    <text x="254" y="392" class="label">Tooling layer</text>
    <text x="254" y="420" class="muted">Log search • Sensor query • Anomaly scoring • Knowledge base</text>
    <path class="dline" d="M 600 290 C 600 320, 600 330, 600 340"/>
    <text x="628" y="328" class="muted">tool calls</text>
  </g>
</svg>

